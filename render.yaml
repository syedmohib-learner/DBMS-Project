services:
  # Backend Web Service
  - type: web
    name: inventory-sales-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-sales-db
          property: connectionString

  # Frontend Static Site
  - type: web
    name: inventory-sales-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: inventory-sales-backend
          property: host

databases:
  - name: inventory-sales-db
    databaseName: inventory_sales_tracker
    user: postgres
    plan: free
